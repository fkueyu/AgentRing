name: Feature request
description: Suggest an interaction, effect or integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want, including which component owns it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
