name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the component (daemon / app / hooks / DSH plugin / firmware) and exact symptoms.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Daemon log, serial output, `/health`, terminal errors. Redact Wi-Fi names/passwords.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: 0.4.0 (git SHA)
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15.x, ESP32-C3, DSH 1.0.x
