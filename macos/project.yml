name: AgentRing
options:
  bundleIdPrefix: com.agentring
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: UKK3BUGG85
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  AgentRing:
    type: application
    platform: macOS
    sources:
      - path: Sources/AgentRing
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
      - path: Configuration/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentring.app
        PRODUCT_NAME: AgentRing
        INFOPLIST_FILE: Configuration/Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/AgentRing.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: false
